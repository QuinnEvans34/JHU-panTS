<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Helvetica, Arial, sans-serif">
  <style>
    .stage { fill:#f4f7fb; stroke:#7091c0; stroke-width:1.5; rx:10; }
    .box   { fill:#ffffff; stroke:#9aa7b5; stroke-width:1.2; rx:6; }
    .hl    { fill:#eef7ee; stroke:#5a9e5a; stroke-width:1.5; rx:6; }
    .title { font-size:15px; font-weight:bold; fill:#2b3a55; }
    .lbl   { font-size:12px; fill:#1f2733; }
    .sub   { font-size:10.5px; fill:#5a6b7b; }
    .phase { font-size:12px; font-weight:bold; fill:#7091c0; letter-spacing:1px; }
    .arrow { stroke:#5a6b7b; stroke-width:2; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5a6b7b"/>
    </marker>
  </defs>

  <text x="480" y="30" text-anchor="middle" class="title" font-size="18">
    Pancreatic-lesion CADe — end-to-end pipeline (static dataset, manual/CLI trigger)</text>

  <!-- 1. DATA PREP -->
  <text x="30" y="66" class="phase">1 · DATA PREP</text>
  <rect x="30" y="74" width="900" height="72" class="stage"/>
  <rect x="46" y="90" width="180" height="42" class="box"/>
  <text x="136" y="108" text-anchor="middle" class="lbl">build_manifest.py</text>
  <text x="136" y="123" text-anchor="middle" class="sub">index CT + masks → manifest.csv</text>
  <rect x="266" y="90" width="200" height="42" class="box"/>
  <text x="366" y="108" text-anchor="middle" class="lbl">create_splits · make_*_cohorts</text>
  <text x="366" y="123" text-anchor="middle" class="sub">patient-level, stratified, leak-checked</text>
  <rect x="506" y="90" width="180" height="42" class="box"/>
  <text x="596" y="108" text-anchor="middle" class="lbl">audit_subregions.py</text>
  <text x="596" y="123" text-anchor="middle" class="sub">exclude empty/misaligned masks</text>
  <rect x="726" y="90" width="188" height="42" class="box"/>
  <text x="820" y="108" text-anchor="middle" class="lbl">make_init_checkpoint</text>
  <text x="820" y="123" text-anchor="middle" class="sub">shared SuPreM init</text>

  <path class="arrow" d="M480,146 L480,172"/>

  <!-- 2. TRAINING -->
  <text x="30" y="196" class="phase">2 · TRAINING</text>
  <rect x="30" y="204" width="900" height="78" class="stage"/>
  <rect x="46" y="222" width="300" height="46" class="hl"/>
  <text x="196" y="242" text-anchor="middle" class="lbl" font-weight="bold">train.py  (SegResNet + SuPreM, whole-box)</text>
  <text x="196" y="258" text-anchor="middle" class="sub">forward → DiceFocal loss → backprop → AdamW</text>
  <rect x="366" y="222" width="270" height="46" class="box"/>
  <text x="501" y="242" text-anchor="middle" class="lbl">tune_optuna.py</text>
  <text x="501" y="258" text-anchor="middle" class="sub">Bayesian HP search → best config</text>
  <rect x="656" y="222" width="258" height="46" class="box"/>
  <text x="785" y="242" text-anchor="middle" class="lbl">checkpoints → MLflow + archive</text>
  <text x="785" y="258" text-anchor="middle" class="sub">best.pt · run_ledger · atomic saves</text>

  <path class="arrow" d="M480,282 L480,308"/>

  <!-- 3. EVALUATION -->
  <text x="30" y="332" class="phase">3 · EVALUATION (held-out test)</text>
  <rect x="30" y="340" width="900" height="72" class="stage"/>
  <rect x="46" y="356" width="270" height="42" class="box"/>
  <text x="181" y="374" text-anchor="middle" class="lbl">evaluate.py</text>
  <text x="181" y="389" text-anchor="middle" class="sub">lesion/pancreas Dice · specificity · sweep</text>
  <rect x="356" y="356" width="250" height="42" class="box"/>
  <text x="481" y="374" text-anchor="middle" class="lbl">analyze_cases.py</text>
  <text x="481" y="389" text-anchor="middle" class="sub">detection · by size · by phase</text>
  <rect x="646" y="356" width="268" height="42" class="box"/>
  <text x="780" y="374" text-anchor="middle" class="lbl">cascade_eval.py</text>
  <text x="780" y="389" text-anchor="middle" class="sub">autonomous ROI + containment audit</text>

  <path class="arrow" d="M480,412 L480,438"/>

  <!-- 4. DEPLOYMENT / SERVING -->
  <text x="30" y="462" class="phase">4 · REGISTRATION · SERVING · UI</text>
  <rect x="30" y="470" width="900" height="76" class="stage"/>
  <rect x="46" y="488" width="250" height="44" class="hl"/>
  <text x="171" y="508" text-anchor="middle" class="lbl" font-weight="bold">register_model.py</text>
  <text x="171" y="523" text-anchor="middle" class="sub">MLflow Model Registry (v1)</text>
  <rect x="316" y="488" width="270" height="44" class="hl"/>
  <text x="451" y="508" text-anchor="middle" class="lbl" font-weight="bold">serve.py  ·  FastAPI  POST /predict</text>
  <text x="451" y="523" text-anchor="middle" class="sub">→ CADe summary JSON (possible-lesion flag)</text>
  <rect x="606" y="488" width="308" height="44" class="box"/>
  <text x="760" y="508" text-anchor="middle" class="lbl">export_case.py → ui/ (React + NiiVue)</text>
  <text x="760" y="523" text-anchor="middle" class="sub">tri-planar CT + 3D mesh overlay (Week 5)</text>

  <!-- cross-cutting concerns -->
  <rect x="30" y="576" width="900" height="118" fill="#fbfbf6" stroke="#c9c088" stroke-width="1.5" rx="10"/>
  <text x="46" y="598" class="phase" fill="#9a8b3a">CROSS-CUTTING</text>
  <text x="46" y="622" class="lbl"><tspan font-weight="bold">Trigger:</tspan> manual / command-line — static dataset, no streaming source, so a scheduler adds nothing (an event trigger would fit a live PACS feed).</text>
  <text x="46" y="644" class="lbl"><tspan font-weight="bold">Data versioning:</tspan> code + config + committed split id-lists in git; manifest/splits regenerated deterministically; raw CT never committed (external drive).</text>
  <text x="46" y="666" class="lbl"><tspan font-weight="bold">Model logging:</tspan> MLflow (params/metrics) + per-run immutable checkpoint archive + run_ledger.csv (MLflow-independent safety net).</text>
  <text x="46" y="688" class="lbl"><tspan font-weight="bold">Error handling:</tspan> startup leakage guard · atomic checkpoint saves · identity-verified strict resume · recipe verification at serve/eval · drive preflight.</text>
</svg>
