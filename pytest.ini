[pytest]
testpaths = tests
python_files = test_*.py
addopts = --strict-config --strict-markers -ra -m "not slow and not licensed_data and not mps and not network and not browser and not release"
xfail_strict = true
markers =
    unit: Small deterministic rule using synthetic inputs.
    contract: Versioned schema or producer/consumer boundary.
    component: Isolated component with controlled adapters.
    integration: Multiple components interacting through their real interfaces.
    failure_injection: Controlled interruption, conflict, or stale-state checks.
    slow: Explicitly scheduled work outside the fast suite.
    licensed_data: Requires authorized local source data and preflight.
    mps: Requires verified Apple Silicon accelerator capability.
    network: Requires an explicitly selected network operation.
    browser: Requires a controlled real-browser environment.
    release: Requires a frozen release candidate and release preflight.
    manual: Named reviewer checklist; not an automated pass claim.
